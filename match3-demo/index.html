<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>开心农场消消乐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a5a8a;
    font-family: "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; width: 540px; height: 960px; overflow: hidden; transform-origin: center center;
    background: linear-gradient(180deg, #5cc0ff 0%, #9fdcff 22%, #d6f3ff 38%, #9ee07a 39%, #6cc24a 60%, #4aa83a 100%); touch-action: none; }
  .cloud { position: absolute; background: #fff; border-radius: 50px; opacity: .9; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 50%; height: 140%; left: 15%; top: -60%; } .cloud::after { width: 40%; height: 120%; left: 48%; top: -40%; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(760px); } }
  .hill { position: absolute; border-radius: 50%; }
  canvas { position: absolute; left: 0; top: 0; width: 540px; height: 960px; pointer-events: none; }
  #fx { z-index: 2600; }
  #world { position: absolute; inset: 0; }

  /* HUD */
  #title { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 900; color: #fff6b0; letter-spacing: 2px;
    text-shadow: 0 3px 0 #d0601a, 2px 0 #d0601a, -2px 0 #d0601a, 0 -2px #d0601a, 0 6px 8px rgba(0,0,0,.3); }
  .card { position: absolute; top: 62px; height: 132px; border-radius: 22px; background: linear-gradient(#ffffff, #e8f1ff); border: 4px solid #fff;
    box-shadow: 0 5px 0 #8fb0d8, 0 10px 16px rgba(0,0,0,.25); text-align: center; }
  .card .cap { margin-top: 6px; font-size: 16px; font-weight: bold; color: #5a7aa6; }
  #lvCard { left: 14px; width: 104px; } #lvCard .big { font-size: 46px; font-weight: 900; color: #ff8a1f; text-shadow: 0 3px 0 #b85a0a; line-height: 1.5; }
  #goalCard { left: 128px; width: 284px; }
  #goals { display: flex; justify-content: center; gap: 18px; margin-top: 8px; }
  .goal { position: relative; width: 70px; height: 84px; }
  .goal svg { width: 62px; height: 62px; }
  .goal .gn { position: absolute; left: 0; right: 0; bottom: 0; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #3a5a8a, 2px 0 #3a5a8a, -2px 0 #3a5a8a, 0 -2px #3a5a8a; }
  .goal.bump { animation: bump .25s; }
  .goal .ok { position: absolute; right: -4px; bottom: 0; width: 32px; height: 32px; border-radius: 50%; background: #3fbf3a; border: 3px solid #fff; display: none;
    color: #fff; font-weight: 900; align-items: center; justify-content: center; font-size: 20px; }
  .goal.done .ok { display: flex; animation: pop .4s cubic-bezier(.3,1.8,.5,1); } .goal.done .gn { display: none; }
  #movesCard { right: 14px; width: 104px; } #moves { font-size: 50px; font-weight: 900; color: #3a8af0; text-shadow: 0 3px 0 #1d5ea3; line-height: 1.45; }
  #movesCard.low #moves { color: #ff4a3a; text-shadow: 0 3px 0 #a8261a; animation: bump .6s infinite; }
  @keyframes bump { 50% { transform: scale(1.18); } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* board */
  #boardBg { position: absolute; border-radius: 22px; background: rgba(200,210,250,.55); border: 4px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 0 rgba(70,90,150,.35), 0 14px 24px rgba(0,0,0,.25); }
  #board { position: absolute; }
  .cell { position: absolute; width: 62px; height: 62px; }
  .cell.t { background: #d9defa; } .cell.t.alt { background: #cbd2f5; }
  .bush { position: absolute; width: 62px; height: 62px; z-index: 1; }
  .bush svg { width: 72px; height: 72px; margin: -5px; }
  .ice { position: absolute; width: 62px; height: 62px; border-radius: 6px; z-index: 2; pointer-events: none;
    background: linear-gradient(135deg, #dff6ff, #7cc8ff 50%, #b5e3ff); border: 3px solid #fff;
    box-shadow: inset 0 0 12px rgba(255,255,255,.95), inset -5px -5px 0 rgba(60,150,230,.55), 0 0 0 1px rgba(60,140,220,.5); }
  .ice::after { content: ""; position: absolute; left: 8px; top: 6px; width: 20px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.9); transform: rotate(-30deg); }
  .ice.h2 { background: linear-gradient(135deg, #c8eeff, #3fa0f0 50%, #8fd0ff); box-shadow: inset 0 0 12px #fff, inset -6px -6px 0 rgba(20,100,200,.6), 0 0 0 2px #2f8ae0; }
  #pieces { position: absolute; left: 0; top: 0; overflow: hidden; z-index: 3; }
  .pc { position: absolute; width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; cursor: pointer; will-change: transform; }
  .pc svg { width: 56px; height: 56px; pointer-events: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
  .pc.hay svg, .pc.sheep svg { width: 62px; height: 62px; }
  .pc.sel { animation: sel .5s ease-in-out infinite alternate; }
  @keyframes sel { to { transform: scale(1.15); } }
  .pc.hint { animation: hintw .5s ease-in-out infinite alternate; }
  @keyframes hintw { from { transform: rotate(-10deg) scale(1.05); } to { transform: rotate(10deg) scale(1.05); } }
  .pc.power svg { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { to { filter: drop-shadow(0 0 8px #fff7a0) drop-shadow(0 3px 2px rgba(0,0,0,.25)); } }
  .sprite { position: absolute; width: 62px; height: 62px; z-index: 2500; pointer-events: none; }
  .sprite svg { width: 62px; height: 62px; }

  /* boosters */
  #boosters { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; gap: 26px; z-index: 10; }
  .boost { position: relative; width: 92px; height: 92px; border-radius: 24px; background: linear-gradient(#ffe27a, #f5a623); border: 4px solid #fff;
    box-shadow: 0 6px 0 #b8700a, 0 10px 14px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .boost svg { width: 58px; height: 58px; }
  .boost .n { position: absolute; top: -8px; right: -8px; min-width: 30px; height: 30px; border-radius: 15px; background: #ff4b4b; color: #fff; font-weight: 900;
    font-size: 17px; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; }
  .boost.on { animation: bump .5s infinite; box-shadow: 0 6px 0 #b8700a, 0 0 22px 6px #fff7a0; }
  .boost:active, .boost.press { transform: translateY(4px); }

  /* overlays */
  .overlay { position: absolute; inset: 0; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,30,60,.55); opacity: 0; pointer-events: none; transition: opacity .4s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .panel { position: relative; background: linear-gradient(#ffffff,#e3efff); border: 6px solid #4aa3ff; border-radius: 28px; padding: 30px 30px 26px; text-align: center; min-width: 380px;
    box-shadow: 0 10px 0 #1d6ab8, 0 18px 30px rgba(0,0,0,.4); transform: scale(.5) translateY(40px); transition: transform .55s cubic-bezier(.3,1.7,.5,1); }
  .overlay.show .panel { transform: none; }
  .panel h1 { font-size: 40px; color: #ff7a1f; text-shadow: 0 3px 0 #fff, 0 5px 0 #f3c08a; }
  .panel p { font-size: 19px; color: #3a5a8a; margin-top: 10px; line-height: 1.55; }
  .ribbon { position: absolute; top: -32px; left: 50%; translate: -50% 0; padding: 9px 50px; background: linear-gradient(#ffb03a,#ff7a1f); color: #fff; font-size: 26px; font-weight: 900;
    border-radius: 12px; box-shadow: 0 5px 0 #b8500a; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .stars { display: flex; justify-content: center; gap: 10px; margin: 24px 0 4px; height: 82px; align-items: flex-end; }
  .stars svg { width: 66px; height: 66px; transform: scale(0); } .stars svg:nth-child(2) { width: 82px; height: 82px; }
  .stars svg.on { animation: starIn .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes starIn { from { transform: scale(3) rotate(-60deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .btns { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }
  .btn { padding: 12px 34px; border-radius: 30px; font-size: 22px; font-weight: bold; color: #fff; cursor: pointer;
    background: linear-gradient(#8de06a,#3fa83a); border: 3px solid #fff; box-shadow: 0 5px 0 #2a7a26; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .btn.blue { background: linear-gradient(#5fc4ff,#2f8ae0); box-shadow: 0 5px 0 #1d5ea3; }
  .btn.pulse { animation: bump 1s ease-in-out infinite; }
  .btn:active, .btn.press { transform: translateY(3px) scale(.96); }
  .gl { display: flex; justify-content: center; gap: 20px; margin-top: 14px; }
  .gl div { position: relative; } .gl svg { width: 64px; height: 64px; }
  .gl span { position: absolute; bottom: -4px; left: 0; right: 0; font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #3a5a8a, 2px 0 #3a5a8a, -2px 0 #3a5a8a, 0 -2px #3a5a8a; }
  #levels { display: grid; grid-template-columns: repeat(4, 84px); gap: 18px; margin-top: 16px; }
  .lv { width: 84px; height: 84px; border-radius: 20px; background: linear-gradient(#ffd56a,#ff9a1f); border: 4px solid #fff; box-shadow: 0 5px 0 #b8600a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #b8600a; cursor: pointer; }
  .lv small { font-size: 13px; color: #ffe; letter-spacing: 1px; } .lv.lock { background: linear-gradient(#cfd6e0,#93a0b0); box-shadow: 0 5px 0 #5f6b7a; text-shadow: none; }

  #banner { position: absolute; left: 0; right: 0; top: 420px; z-index: 2900; text-align: center; pointer-events: none; opacity: 0; }
  #banner .b { display: inline-block; padding: 14px 70px; font-size: 44px; font-weight: 900; color: #fff;
    background: linear-gradient(90deg, rgba(255,122,31,0), #ff7a1f 18%, #ffb03a 50%, #ff7a1f 82%, rgba(255,122,31,0)); text-shadow: 0 3px 0 #a84a0a; }
  .float { position: absolute; z-index: 2700; font-weight: 900; pointer-events: none; white-space: nowrap; translate: -50% -50%; }
  .praise { font-size: 50px; color: #fff; text-shadow: 0 4px 0 #ff5a8a, 3px 0 #ff5a8a, -3px 0 #ff5a8a, 0 -3px #ff5a8a, 0 10px 16px rgba(0,0,0,.35); }
  #toast { position: absolute; left: 50%; top: 820px; translate: -50% 0; z-index: 3500; padding: 10px 24px; border-radius: 22px; background: rgba(0,0,0,.65);
    color: #fff; font-size: 18px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #finger { position: absolute; width: 62px; height: 62px; z-index: 5000; pointer-events: none; left: 300px; top: 1100px;
    transition: left .24s cubic-bezier(.4,.1,.3,1), top .24s cubic-bezier(.4,.1,.3,1), transform .1s; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }
  #finger.tap { transform: scale(.82); }
  #fade { position: absolute; inset: 0; background: #000; z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .8s; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="bg"></canvas>
  <div id="world">
    <div id="title">开心农场消消乐</div>
    <div class="card" id="lvCard"><div class="cap">关卡</div><div class="big" id="lvNum">1</div></div>
    <div class="card" id="goalCard"><div class="cap">目标</div><div id="goals"></div></div>
    <div class="card" id="movesCard"><div class="cap">步数</div><div id="moves">25</div></div>
    <div id="boardBg"></div>
    <div id="board"><div id="cells"></div><div id="pieces"></div></div>
    <div id="boosters">
      <div class="boost" id="bHammer"><span class="n">3</span></div>
      <div class="boost" id="bShuffle"><span class="n">2</span></div>
      <div class="boost" id="bMap"></div>
    </div>
  </div>
  <canvas id="fx"></canvas>
  <div id="banner"><div class="b" id="bannerT">第 1 关</div></div>
  <div id="toast"></div>
  <div class="overlay" id="startO"><div class="panel">
    <div class="ribbon" id="startTitle">第 1 关</div>
    <p style="margin-top:18px">完成以下目标：</p>
    <div class="gl" id="startGoals"></div>
    <p id="startMoves"></p>
    <div class="btns"><div class="btn pulse" id="startBtn">开始</div></div>
  </div></div>
  <div class="overlay" id="winO"><div class="panel">
    <div class="ribbon">关卡完成</div>
    <div class="stars" id="winStars"></div>
    <p id="winInfo"></p>
    <div class="btns"><div class="btn blue" id="winMap">关卡</div><div class="btn pulse" id="winNext">下一关</div></div>
  </div></div>
  <div class="overlay" id="loseO"><div class="panel">
    <div class="ribbon" style="background:linear-gradient(#8a96a6,#5f6b7a);box-shadow:0 5px 0 #3e4752">步数用完了</div>
    <p style="margin-top:20px">就差一点点！再试一次吧</p>
    <div class="btns"><div class="btn blue" id="loseMap">关卡</div><div class="btn" id="loseRetry">重新开始</div></div>
  </div></div>
  <div class="overlay" id="mapO"><div class="panel">
    <div class="ribbon">选择关卡</div>
    <div id="levels"></div>
  </div></div>
  <div class="overlay" id="endO"><div class="panel">
    <h1>开心农场消消乐</h1>
    <p>火箭 · 炸弹 · 螺旋桨 · 彩虹球<br>解救小羊、打碎冰块、清理草垛！</p>
    <div class="gl" id="endIcons"></div>
    <div class="btns"><div class="btn pulse">立即开玩</div></div>
  </div></div>
  <svg id="finger" viewBox="0 0 64 64"><path d="M24 6c3 0 5 2 5 5v17l2-1c2-1 5 0 6 2l1 2 2-1c2-1 5 0 6 2l1 2 1-.3c2.7-.7 5 1.3 5 4v10c0 8-6 14-14 14h-6c-5 0-9-2-12-6L9 41c-1.5-2-1-5 1-6.3 2-1.3 4.5-.8 6 1l3 3.5V11c0-3 2-5 5-5Z" fill="#fff" stroke="#333" stroke-width="2.4" stroke-linejoin="round"/></svg>
  <div id="fade"></div>
</div></div>

<script>
'use strict';
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo'), FAST = Q.has('fast');
const $ = id => document.getElementById(id);
const wait = ms => FAST ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const anim = (el, kf, o) => FAST || !el ? Promise.resolve() : el.animate(kf, o).finished;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(1);

// =====================================================================
// Art (inline SVG)
// =====================================================================
const ITEMS = [
  `<defs><radialGradient id="g0" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#a8d6ff"/><stop offset=".45" stop-color="#2f7cf0"/><stop offset="1" stop-color="#1446a8"/></radialGradient></defs>
   <path d="M76 54 Q96 46 92 28 L85 30 Q86 44 72 48Z" fill="url(#g0)" stroke="#0e3a8a" stroke-width="2"/>
   <path d="M24 48 Q6 48 9 63 Q12 74 26 70" fill="none" stroke="#1a55c0" stroke-width="7" stroke-linecap="round"/>
   <ellipse cx="50" cy="61" rx="31" ry="27" fill="url(#g0)" stroke="#0e3a8a" stroke-width="2"/>
   <ellipse cx="50" cy="37" rx="20" ry="6" fill="#3d8af5" stroke="#0e3a8a" stroke-width="2"/>
   <circle cx="50" cy="28" r="6" fill="#5aa0ff" stroke="#0e3a8a" stroke-width="2"/>
   <ellipse cx="37" cy="51" rx="9" ry="6" fill="#fff" opacity=".6" transform="rotate(-30 37 51)"/>`,
  `<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ffaa00"/><stop offset=".35" stop-color="#ffe86a"/><stop offset="1" stop-color="#f08a00"/></linearGradient></defs>
   <path d="M20 34 L28 84 Q50 94 72 84 L80 34Z" fill="url(#g1)" stroke="#a86400" stroke-width="2.5" stroke-linejoin="round"/>
   <path d="M24 58 Q50 66 76 58" stroke="#e08a00" stroke-width="4" fill="none"/>
   <ellipse cx="50" cy="34" rx="31" ry="11" fill="#ffd23a" stroke="#a86400" stroke-width="2.5"/>
   <ellipse cx="50" cy="34" rx="21" ry="6" fill="#d98a00"/>
   <path d="M31 44 L35 76" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>`,
  `<defs><radialGradient id="g2" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#ffa090"/><stop offset=".4" stop-color="#ef2b2b"/><stop offset="1" stop-color="#a00f1a"/></radialGradient></defs>
   <path d="M50 30 C30 16 10 32 14 56 C18 80 36 92 50 86 C64 92 82 80 86 56 C90 32 70 16 50 30Z" fill="url(#g2)" stroke="#7a0a12" stroke-width="2"/>
   <path d="M50 30 Q52 18 58 12" stroke="#6b3a12" stroke-width="5" stroke-linecap="round" fill="none"/>
   <path d="M56 22 Q72 8 84 18 Q70 30 56 22Z" fill="#4fc03a" stroke="#2a7a1a" stroke-width="2"/>
   <ellipse cx="32" cy="47" rx="7" ry="11" fill="#fff" opacity=".55" transform="rotate(25 32 47)"/>`,
  `<defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0f870"/><stop offset=".5" stop-color="#4cc23a"/><stop offset="1" stop-color="#1f7a20"/></linearGradient></defs>
   <path d="M50 8 C82 28 88 62 50 92 C12 62 18 28 50 8Z" fill="url(#g3)" stroke="#16611a" stroke-width="2.5"/>
   <path d="M50 18 V84 M50 40 L34 30 M50 40 L66 30 M50 58 L32 48 M50 58 L68 48" stroke="#eaffc8" stroke-width="3" stroke-linecap="round" opacity=".85"/>`,
  `<defs><radialGradient id="g4" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f4d0ff"/><stop offset=".45" stop-color="#a24ee8"/><stop offset="1" stop-color="#5a1a9a"/></radialGradient></defs>
   <path d="M50 22 Q50 10 60 6" stroke="#5a3a12" stroke-width="4" fill="none" stroke-linecap="round"/>
   ${[[36, 30], [52, 28], [68, 32], [28, 46], [44, 46], [60, 46], [74, 48], [36, 62], [52, 62], [66, 62], [44, 78], [58, 78]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="10.5" fill="url(#g4)" stroke="#4a1080" stroke-width="1.5"/>`).join('')}`,
];
const ITEM_COL = ['#4a9aff', '#ffc21a', '#ff4a4a', '#5ad04a', '#b06bff'];
const ITEM_NAME = ['茶壶', '蜂蜜罐', '苹果', '树叶', '葡萄'];
const ROCKET = `<defs><linearGradient id="rk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a6a"/><stop offset=".5" stop-color="#e5251f"/><stop offset="1" stop-color="#a0100f"/></linearGradient></defs>
  <path d="M18 42 L4 50 L18 58Z" fill="#ffb21f"/><path d="M18 46 L10 50 L18 54Z" fill="#fff27a"/>
  <path d="M30 36 L20 26 L20 40Z M30 64 L20 74 L20 60Z" fill="#2f7cf0" stroke="#123c8a" stroke-width="1.5"/>
  <rect x="18" y="36" width="54" height="28" rx="9" fill="url(#rk)" stroke="#6a0a0a" stroke-width="2"/>
  <rect x="34" y="36" width="8" height="28" fill="#fff"/><rect x="50" y="36" width="8" height="28" fill="#fff"/>
  <path d="M72 37 Q94 50 72 63Z" fill="#ffd21a" stroke="#a86400" stroke-width="2"/>
  <rect x="22" y="40" width="44" height="5" rx="2.5" fill="#fff" opacity=".5"/>`;
const POWER = {
  rh: ROCKET,
  rv: `<g transform="rotate(90 50 50)">${ROCKET}</g>`,
  bomb: `<defs><radialGradient id="bm" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7a8aff"/><stop offset=".5" stop-color="#2a2f7a"/><stop offset="1" stop-color="#0c0f30"/></radialGradient></defs>
    <circle cx="46" cy="58" r="31" fill="url(#bm)" stroke="#05061a" stroke-width="2"/>
    <rect x="52" y="22" width="18" height="14" rx="3" fill="#8a96a6" stroke="#3a4250" stroke-width="2" transform="rotate(35 61 29)"/>
    <path d="M66 22 Q74 10 84 12" stroke="#a86400" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="86" cy="12" r="8" fill="#ffd21a"/><circle cx="86" cy="12" r="4" fill="#fff"/>
    <ellipse cx="34" cy="46" rx="9" ry="6" fill="#fff" opacity=".55" transform="rotate(-35 34 46)"/>`,
  prop: `<defs><radialGradient id="pp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e6b8ff"/><stop offset=".5" stop-color="#7a2ad0"/><stop offset="1" stop-color="#3a0a7a"/></radialGradient></defs>
    <circle cx="50" cy="62" r="28" fill="url(#pp)" stroke="#2a0660" stroke-width="2"/>
    <path d="M22 62 Q50 74 78 62" stroke="#ffd21a" stroke-width="5" fill="none"/>

  if (Math.abs(dx) > Math.abs(dy)) trySwap(d.r, d.c, d.r, d.c + Math.sign(dx)); else trySwap(d.r, d.c, d.r + Math.sign(dy), d.c); });
addEventListener('pointerup', () => { if (!drag) return; const { r, c } = drag; drag = null;
  if (S.hammer) return useHammer(r, c);
  const p = grid[r][c].p;
  if (selected) { const s = selected; selected = null; s.el?.classList.remove('sel'); if (Math.abs(s.r - r) + Math.abs(s.c - c) === 1) return trySwap(s.r, s.c, r, c); if (s.p === p) return; }
  if (p && p.kind === 'power') return tapPower(r, c);
  if (swappable(p)) { selected = { r, c, p, el: p.el }; p.el?.classList.add('sel'); } });

let hintT = 0, hinted = [];
function clearHint() { clearTimeout(hintT); hinted.forEach(el => el?.classList.remove('hint')); hinted = []; }
function armHint() { clearHint(); if (DEMO || FAST || !S || S.state !== 'play') return;
  hintT = setTimeout(() => { const m = findMove(); if (!m) return; hinted = [grid[m.r][m.c].p?.el, grid[m.r2][m.c2].p?.el]; hinted.forEach(el => el?.classList.add('hint')); }, 5000); }

function fitStage() { const s = Math.min(innerWidth / 540, innerHeight / 960); $('stage').style.transform = `scale(${s})`; }
addEventListener('resize', fitStage); fitStage();

// =====================================================================
// Bot / demo / headless simulation
// =====================================================================
const until = async f => { while (!f()) await (FAST ? Promise.resolve() : wait(30)); };
async function botTurn() {
  const m = findMove(); if (!m) return false;
  if (DEMO) await fingerSwipe(m); else await trySwap(m.r, m.c, m.r2, m.c2);
  await until(() => !S.busy || S.state !== 'play');
  return true;
}
window.simLevel = async (n, seed) => {
  openLevel(n, seed); startPlay();
  let guard = 0;
  while (S.state === 'play' && guard++ < 200) { if (!(await botTurn())) break; }
  return { state: S.state, left: S.leftAtWin ?? 0, goals: S.goals.map(g => g.k + ':' + g.n).join(' '), cascades: S.cascades };
};
const finger = $('finger');
async function fingerTo(x, y) { finger.style.left = (x - 22) + 'px'; finger.style.top = (y - 6) + 'px'; await wait(260); }
async function fingerTap(el) { const b = el.getBoundingClientRect(), st = $('stage').getBoundingClientRect(), sc = st.width / 540;
  const x = (b.left - st.left) / sc + b.width / sc / 2, y = (b.top - st.top) / sc + b.height / sc / 2;
  await fingerTo(x, y); finger.classList.add('tap'); el.classList.add('press'); P({ type: 'ring', x, y, max: .4, size: 8, grow: 40, color: 'rgba(255,255,255,' });
  await wait(100); finger.classList.remove('tap'); el.classList.remove('press'); el.click(); }
async function fingerSwipe(m) {
  await fingerTo(sx(m.c), sy(m.r)); finger.classList.add('tap'); await wait(80);
  finger.style.left = (sx(m.c2) - 22) + 'px'; finger.style.top = (sy(m.r2) - 6) + 'px';
  trySwap(m.r, m.c, m.r2, m.c2); await wait(200); finger.classList.remove('tap');
}
async function runDemo() {
  (Q.get('seeds') || '1,1').split(',').map(Number).forEach((v, i) => SEEDS[i + 1] = v);
  Snd.init(); Snd.resume(); Snd.log = [];
  await wait(800);
  window.__t0 = Date.now(); Snd.startMusic();
  openLevel(1); await wait(1500);
  await fingerTap($('startBtn')); await wait(1100);
  while (S.state === 'play') { if (!(await botTurn())) break; await wait(120); }
  await until(() => S.state === 'win' || S.state === 'lose'); window.__l1 = S.state + ':' + S.leftAtWin; await wait(2600);
  finger.style.top = '1100px';
  if (S.state === 'win') { await fingerTap($('winNext')); }
  await wait(1400);
  if (S.n !== 2) openLevel(2);
  await fingerTap($('startBtn')); await wait(1100);
  for (let i = 0; i < 9 && S.state === 'play'; i++) { await botTurn(); await wait(120); }
  await until(() => !S.busy); await wait(400);
  finger.style.top = '1100px'; S.state = 'menu'; show('endO'); Snd.play('win'); confettiCannon(0, 1); confettiCannon(540, -1);
  await wait(4200);
  $('fade').style.opacity = 1; Snd.log.push({ t: Date.now(), name: '#fade' }); Snd.master.gain.setTargetAtTime(0, Snd.ctx.currentTime, .25); await wait(1000);
  window.__t1 = Date.now(); document.title = 'DEMO_DONE';
}
setBoostN();
if (DEMO) runDemo(); else if (!FAST) openMap();
</script>
