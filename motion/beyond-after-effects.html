<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyond After Effects</title>
<!--
  BEYOND AFTER EFFECTS — 15s procedural motion graphic (1080 × 1920, 9:16)
  ------------------------------------------------------------------------
  Pure Canvas 2D, zero dependencies, zero keyframes.
  Every pixel is a pure function of t ∈ [0, 15):  render(t).
  t = 15 evaluates to exactly the same state as t = 0  →  seamless loop.

  Timeline
    0.0 –  3.0  LOCK / BREACH      dolly-in, reticle contracts & locks, glitch-typed headline
    3.0 –  8.0  ARCHITECTURE       headline fuses to a point → wireframe cube + low-poly sphere,
                                   kinetic type "PROMPT → CODE → VIDEO"
    8.0 – 12.0  EMISSION           ~560 particles on sine-decayed spirals, camera orbit,
                                   "ZERO KEYFRAMES" rushes in from deep Z
   12.0 – 15.0  RECURSION          everything collapses into the gravity well, reticle re-opens

  Controls:  Space = play/pause · ← / → = step 1 frame · R = restart · F = fullscreen
  Debug:     window.renderAt(seconds) renders an arbitrary frame (paused).
-->
<style>
  :root { --bg:#0B0F17; --cyan:#38BDF8; --orange:#FB923C; --gray:#64748B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#05070B; overflow:hidden; }
  body { font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; color:#fff; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px; }
  canvas { display:block; background:var(--bg); cursor:pointer;
           box-shadow:0 0 0 1px rgba(100,116,139,.28), 0 30px 90px rgba(0,0,0,.7); }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid rgba(100,116,139,.35);
         background:rgba(11,15,23,.9); border-radius:10px; width:min(560px, 100%); }
  #bar button { all:unset; cursor:pointer; width:34px; height:34px; display:grid; place-items:center; border-radius:7px;
                color:#fff; font-size:15px; border:1px solid rgba(100,116,139,.45); flex:none; }
  #bar button:hover { border-color:var(--cyan); color:var(--cyan); }
  #bar button#play { color:var(--orange); border-color:rgba(251,146,60,.6); }
  #scrub { flex:1; min-width:60px; accent-color:var(--cyan); }
  #time { font-size:12px; color:var(--gray); white-space:nowrap; font-variant-numeric:tabular-nums; }
  #time b { color:#fff; font-weight:500; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920" aria-label="15 秒程序化动态视觉"></canvas>
  <div id="bar">
    <button id="restart" title="重新开始 (R)">⟲</button>
    <button id="play" title="播放 / 暂停 (Space)">❚❚</button>
    <input id="scrub" type="range" min="0" max="15000" step="1" value="0" aria-label="时间轴">
    <span id="time"><b>00.000</b> / 15.000s</span>
    <button id="fs" title="全屏 (F)">⛶</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────────────────── constants ───────────────────────── */
const W = 1080, H = 1920, DUR = 15, FPS = 60, TAU = Math.PI * 2;
const CX = 540, CY = 880;          // optical centre of the 3D scene
const F = 1100;                     // focal length (px)
const FLOOR = -650;                 // grid floor height (world units)
const NEAR = 60;                    // near clip plane

const RGB = { white:[255,255,255], cyan:[56,189,248], orange:[251,146,60], gray:[100,116,139], bg:[11,15,23] };
const rgba = (c, a) => `rgba(${RGB[c][0]},${RGB[c][1]},${RGB[c][2]},${a})`;
const SANS = '"Inter","Helvetica Neue","Segoe UI","Arial Black",Arial,sans-serif';
const MONO = '"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace';

/* ───────────────────────── math & easing ───────────────────────── */
const easeOutExpo = t => 1 - Math.pow(2, -10 * t);                 // required core easing
const expoN = x => easeOutExpo(clamp(x)) / easeOutExpo(1);        // normalised: exactly 0 → 1
const easeInExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, 10 * x - 10);
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smoother = x => x * x * x * (x * (x * 6 - 15) + 10);         // C2-continuous smoothstep
function clamp(x, a = 0, b = 1) { return x < a ? a : x > b ? b : x; }
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, c, d) => smoother(seg(t, a, b)) * (1 - smoother(seg(t, c, d)));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ───────────────────────── canvas setup ───────────────────────── */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

function glowSprite(col, size = 128) {
  const c = mk(size, size), g = c.getContext('2d'), r = size / 2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.12, rgba(col, 1));
  gr.addColorStop(.35, rgba(col, .35));
  gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const SPR = { cyan: glowSprite('cyan'), white: glowSprite('white'), orange: glowSprite('orange') };
const SPR_LIST = [SPR.cyan, SPR.white, SPR.orange];

// static background: base colour + cold haze
const bgC = mk(W, H); {
  const g = bgC.getContext('2d');
  g.fillStyle = '#0B0F17'; g.fillRect(0, 0, W, H);
  let gr = g.createRadialGradient(CX, CY, 0, CX, CY, 900);
  gr.addColorStop(0, 'rgba(56,189,248,0.07)'); gr.addColorStop(1, 'rgba(56,189,248,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
// static post-fx: scanlines + vignette
const fxC = mk(W, H); {
  const g = fxC.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.10)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 1);
  const gr = g.createRadialGradient(CX, H / 2, 380, CX, H / 2, 1250);
  gr.addColorStop(0, 'rgba(5,7,11,0)'); gr.addColorStop(1, 'rgba(5,7,11,0.72)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* ───────────────────────── camera ───────────────────────── */
const cam = { yaw:0, pitch:0, dist:2300, roll:0, cY:1, sY:0, cP:1, sP:0, shx:0, shy:0, orbit:0 };
function updateCamera(t) {
  const orbit = Math.sin(Math.PI * smoother(seg(t, 7.4, 14.6)));   // 0 → 1 → 0, zero velocity at ends
  cam.orbit = orbit;
  cam.yaw   = 0.06 * Math.sin(TAU * t / DUR) + 0.62 * orbit;
  cam.pitch = 0.15 + 0.03 * Math.sin(TAU * 2 * t / DUR) - 0.05 * orbit;
  cam.roll  = 0.035 * orbit;
  cam.dist  = 2300
            - 380 * smoother(seg(t, 0, 3.2))                 // slow push-in
            + 300 * win(t, 7.6, 9.6, 11.6, 13.4)             // breathe out for the particle storm
            + 380 * smoother(seg(t, 12.2, 15));              // return to origin pose
  cam.cY = Math.cos(cam.yaw); cam.sY = Math.sin(cam.yaw);
  cam.cP = Math.cos(cam.pitch); cam.sP = Math.sin(cam.pitch);
  // impact shake (damped), forced to 0 before the loop point
  let s = 0;
  for (const [t0, a] of [[3.0, 16], [9.45, 20], [14.3, 8]]) if (t > t0) s += a * Math.exp(-(t - t0) * 9);
  s *= 1 - seg(t, 14.7, 15);
  cam.shx = s * Math.sin(t * 93.0); cam.shy = s * Math.cos(t * 71.0);
}
let QX, QY, QZ, PX, PY, PS;
function toCam(x, y, z) {
  const x1 = x * cam.cY - z * cam.sY, z1 = x * cam.sY + z * cam.cY;
  QX = x1; QY = y * cam.cP - z1 * cam.sP; QZ = y * cam.sP + z1 * cam.cP + cam.dist;
}
function project(x, y, z) { toCam(x, y, z); PS = F / Math.max(QZ, NEAR); PX = CX + QX * PS; PY = CY - QY * PS; }

/* ───────────────────────── perspective grid floor ───────────────────────── */
const GS = 260, NB = 10;
const gridB = { minor: Array.from({ length: NB }, () => []), major: Array.from({ length: NB }, () => []) };
const depthAlpha = z => seg(z, NEAR, 700) * Math.pow(1 - seg(z, 700, 9500), 1.6);
function gridSeg(x0, z0, x1, z1, major) {
  toCam(x0, FLOOR, z0); let ax = QX, ay = QY, az = QZ;
  toCam(x1, FLOOR, z1); let bx = QX, by = QY, bz = QZ;
  if (az < NEAR && bz < NEAR) return;
  if (az < NEAR) { const k = (NEAR - az) / (bz - az); ax += (bx - ax) * k; ay += (by - ay) * k; az = NEAR; }
  else if (bz < NEAR) { const k = (NEAR - bz) / (az - bz); bx += (ax - bx) * k; by += (ay - by) * k; bz = NEAR; }
  const a = depthAlpha((az + bz) / 2);
  if (a < 0.02) return;
  (major ? gridB.major : gridB.minor)[Math.min(NB - 1, a * NB | 0)]
    .push(CX + ax * F / az, CY - ay * F / az, CX + bx * F / bz, CY - by * F / bz);
}
function drawGrid(t) {
  for (const k of ['minor', 'major']) for (const b of gridB[k]) b.length = 0;
  const X0 = -5200, X1 = 5200, Z0 = -5000, Z1 = 11000;
  // lines of constant x (receding into depth)
  for (let x = X0; x <= X1; x += GS) {
    const major = Math.round(x / GS) % 4 === 0;
    for (let z = Z0; z < Z1; z += 640) gridSeg(x, z, x, z + 640, major);
  }
  // lines of constant z, scrolling toward the lens: 24 cells per loop → integer wrap at t = 15
  const s = (t / DUR) * 24 * GS, base = Math.floor(s / GS);
  for (let k = 0; k < 62; k++) {
    const z = Z0 + (k + base) * GS - s;
    const major = ((k + base) % 4) === 0;
    for (let i = 0; i < 8; i++) gridSeg(lerp(X0, X1, i / 8), z, lerp(X0, X1, (i + 1) / 8), z, major);
  }
  const boost = 1 + 0.8 * (t > 3 ? Math.exp(-(t - 3) * 3) : 0);
  ctx.lineCap = 'butt';
  const pass = (arr, col, base, lw) => {
    ctx.lineWidth = lw;
    for (let b = 0; b < NB; b++) {
      const L = arr[b]; if (!L.length) continue;
      ctx.strokeStyle = rgba(col, Math.min(1, ((b + .5) / NB) * base * boost));
      ctx.beginPath();
      for (let i = 0; i < L.length; i += 4) { ctx.moveTo(L[i], L[i + 1]); ctx.lineTo(L[i + 2], L[i + 3]); }
      ctx.stroke();
    }
  };
  pass(gridB.minor, 'gray', 0.85, 1.5);
  pass(gridB.major, 'cyan', 0.9, 2.2);

  // horizon fog + glow line
  const hy = CY + F * Math.tan(cam.pitch);
  const fg = ctx.createLinearGradient(0, hy - 220, 0, hy + 300);
  fg.addColorStop(0, 'rgba(11,15,23,0)'); fg.addColorStop(.42, 'rgba(11,15,23,1)'); fg.addColorStop(1, 'rgba(11,15,23,0)');
  ctx.fillStyle = fg; ctx.fillRect(-300, hy - 220, W + 600, 520);
  const hl = ctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, 'rgba(56,189,248,0)'); hl.addColorStop(.5, 'rgba(56,189,248,0.35)'); hl.addColorStop(1, 'rgba(56,189,248,0)');
  ctx.fillStyle = hl; ctx.fillRect(-300, hy - 1, W + 600, 2);
}

/* ───────────────────────── geometry: cube + low-poly sphere ───────────────────────── */
const CUBE_V = [];
for (let i = 0; i < 8; i++) CUBE_V.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
const CUBE_E = [];
for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) { const d = a ^ b; if (d === 1 || d === 2 || d === 4) CUBE_E.push([a, b]); }

const SPH = (() => {
  const p = (1 + Math.sqrt(5)) / 2;
  let v = [[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]];
  let f = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
           [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const norm = a => { const l = Math.hypot(...a); return a.map(c => c / l); };
  v = v.map(norm);
  const cache = new Map();
  const mid = (a, b) => {
    const k = a < b ? a + '_' + b : b + '_' + a;
    if (!cache.has(k)) { v.push(norm([(v[a][0] + v[b][0]) / 2, (v[a][1] + v[b][1]) / 2, (v[a][2] + v[b][2]) / 2])); cache.set(k, v.length - 1); }
    return cache.get(k);
  };
  const nf = [];
  for (const [a, b, c] of f) { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a); nf.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); }
  v = v.map((q, i) => { const j = 1 + 0.14 * (hash(i * 9.1) - .5); return [q[0] * j, q[1] * j, q[2] * j]; }); // faceted low-poly jitter
  const es = new Set(), e = [];
  for (const [a, b, c] of nf) for (const [x, y] of [[a, b], [b, c], [c, a]]) {
    const k = x < y ? x + '_' + y : y + '_' + x; if (!es.has(k)) { es.add(k); e.push([x, y]); }
  }
  return { v, f: nf, e };
})();
const sphW = new Float32Array(SPH.v.length * 3), sphP = new Float32Array(SPH.v.length * 3);
const cubeP = new Float32Array(24);
const faceOrder = SPH.f.map((_, i) => i), faceDepth = new Float32Array(SPH.f.length);
const LIGHT = (() => { const l = [0.4, 0.75, -0.55], n = Math.hypot(...l); return l.map(c => c / n); })();

function rotate(x, y, z, ry, rx, out, o) {
  const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
  const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  out[o] = x1; out[o + 1] = y * cx - z1 * sx; out[o + 2] = y * sx + z1 * cx;
}

function objectScale(t) {
  const birth = expoN(seg(t, 3.0, 4.3)) + 0.14 * Math.sin(Math.PI * seg(t, 3.0, 3.9));
  return birth * (1 - easeInOutCubic(seg(t, 12.0, 14.0)));
}

function drawObjects(t) {
  const S = objectScale(t);
  if (S <= 0.001) return;
  const spinC = easeInOutCubic(seg(t, 12.0, 14.0)) * TAU * 2;      // accelerate into collapse
  const ry = TAU * 2 * t / DUR + spinC, rx = 0.55 + 0.35 * Math.sin(TAU * t / DUR);
  const tmp = [0, 0, 0];
  const front = z => z < cam.dist;

  /* orbit ring */
  ctx.globalCompositeOperation = 'lighter';
  const RR = 470 * S, ringRy = -TAU * 3 * t / DUR, ringRx = 1.15;
  ctx.lineWidth = 1.6;
  for (const pass of [0, 1]) {
    ctx.strokeStyle = rgba('cyan', pass ? 0.55 : 0.18);
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 120; i++) {
      const a = i / 120 * TAU;
      rotate(Math.cos(a) * RR, 0, Math.sin(a) * RR, ringRy, ringRx, tmp, 0);
      project(tmp[0], tmp[1], tmp[2]);
      if ((front(QZ) ? 1 : 0) !== pass || i % 2) { first = true; continue; }    // dashed
      if (first) { ctx.moveTo(PX, PY); first = false; } else ctx.lineTo(PX, PY);
      const a2 = (i + 1) / 120 * TAU;
      rotate(Math.cos(a2) * RR, 0, Math.sin(a2) * RR, ringRy, ringRx, tmp, 0);
      project(tmp[0], tmp[1], tmp[2]); ctx.lineTo(PX, PY); first = true;
    }
    ctx.stroke();
  }
  // ring ticks + travelling orange marker
  ctx.strokeStyle = rgba('gray', 0.8); ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * TAU;
    rotate(Math.cos(a) * RR, 0, Math.sin(a) * RR, ringRy, ringRx, tmp, 0); project(tmp[0], tmp[1], tmp[2]);
    const x0 = PX, y0 = PY;
    rotate(Math.cos(a) * RR * 1.06, 0, Math.sin(a) * RR * 1.06, ringRy, ringRx, tmp, 0); project(tmp[0], tmp[1], tmp[2]);
    ctx.moveTo(x0, y0); ctx.lineTo(PX, PY);
  }
  ctx.stroke();
  {
    const a = TAU * 3 * t / DUR;
    rotate(Math.cos(a) * RR, 0, Math.sin(a) * RR, ringRy, ringRx, tmp, 0); project(tmp[0], tmp[1], tmp[2]);
    const s = 70 * PS * Math.min(1, S);
    ctx.drawImage(SPR.orange, PX - s, PY - s, s * 2, s * 2);
  }

  /* sphere: faces (hologram shading) */
  const SR = 200 * S;
  const vs = SPH.v;
  for (let i = 0; i < vs.length; i++) {
    rotate(vs[i][0] * SR, vs[i][1] * SR, vs[i][2] * SR, -ry * 0.75, rx + 0.4, sphW, i * 3);
    project(sphW[i * 3], sphW[i * 3 + 1], sphW[i * 3 + 2]);
    sphP[i * 3] = PX; sphP[i * 3 + 1] = PY; sphP[i * 3 + 2] = QZ;
  }
  for (let i = 0; i < SPH.f.length; i++) { const [a, b, c] = SPH.f[i]; faceDepth[i] = sphP[a * 3 + 2] + sphP[b * 3 + 2] + sphP[c * 3 + 2]; }
  faceOrder.sort((a, b) => faceDepth[b] - faceDepth[a]);
  ctx.globalCompositeOperation = 'source-over';
  for (const i of faceOrder) {
    const [a, b, c] = SPH.f[i];
    const ux = sphW[b*3] - sphW[a*3], uy = sphW[b*3+1] - sphW[a*3+1], uz = sphW[b*3+2] - sphW[a*3+2];
    const vx = sphW[c*3] - sphW[a*3], vy = sphW[c*3+1] - sphW[a*3+1], vz = sphW[c*3+2] - sphW[a*3+2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const nl = Math.hypot(nx, ny, nz) || 1;
    const l = Math.abs((nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / nl);
    ctx.fillStyle = l > 0.93 ? rgba('cyan', 0.30) : rgba('cyan', 0.03 + 0.15 * l * l);
    ctx.beginPath();
    ctx.moveTo(sphP[a*3], sphP[a*3+1]); ctx.lineTo(sphP[b*3], sphP[b*3+1]); ctx.lineTo(sphP[c*3], sphP[c*3+1]);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? 'rgba(226,240,255,0.55)' : rgba('gray', 0.35);
    ctx.lineWidth = pass ? 1.4 : 1;
    ctx.beginPath();
    for (const [a, b] of SPH.e) {
      const isF = front((sphP[a*3+2] + sphP[b*3+2]) / 2) ? 1 : 0;
      if (isF !== pass) continue;
      ctx.moveTo(sphP[a*3], sphP[a*3+1]); ctx.lineTo(sphP[b*3], sphP[b*3+1]);
    }
    ctx.stroke();
  }
  for (let i = 0; i < vs.length; i++) {
    const hot = i % 9 === 0;
    const s = (hot ? 34 : 12) * F / sphP[i*3+2] * Math.min(1, S);
    ctx.globalAlpha = front(sphP[i*3+2]) ? 1 : 0.4;
    ctx.drawImage(hot ? SPR.orange : SPR.white, sphP[i*3] - s, sphP[i*3+1] - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;

  /* cube */
  const CS = 300 * S;
  for (let i = 0; i < 8; i++) {
    rotate(CUBE_V[i][0] * CS, CUBE_V[i][1] * CS, CUBE_V[i][2] * CS, ry, rx, tmp, 0);
    project(tmp[0], tmp[1], tmp[2]);
    cubeP[i*3] = PX; cubeP[i*3+1] = PY; cubeP[i*3+2] = QZ;
  }
  for (const [lw, aF, aB] of [[9, 0.14, 0.05], [2.4, 0.95, 0.35]]) {
    ctx.lineWidth = lw;
    for (const pass of [0, 1]) {
      ctx.strokeStyle = rgba('cyan', pass ? aF : aB);
      ctx.beginPath();
      for (const [a, b] of CUBE_E) {
        if ((front((cubeP[a*3+2] + cubeP[b*3+2]) / 2) ? 1 : 0) !== pass) continue;
        ctx.moveTo(cubeP[a*3], cubeP[a*3+1]); ctx.lineTo(cubeP[b*3], cubeP[b*3+1]);
      }
      ctx.stroke();
    }
  }
  // energy beams at birth
  const beam = win(t, 3.0, 3.04, 3.3, 3.95);
  if (beam > 0) {
    ctx.strokeStyle = rgba('orange', 0.8 * beam); ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 8; i++) { ctx.moveTo(CX, CY); ctx.lineTo(cubeP[i*3], cubeP[i*3+1]); }
    ctx.stroke();
  }
  // vertex markers
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = `500 17px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const labA = clamp(S * 1.2) * (1 - seg(t, 11.6, 12.2));
  for (let i = 0; i < 8; i++) {

    ctx.beginPath(); ctx.strokeStyle = rgba('gray', 0.9); ctx.textAlign = dir > 0 ? 'left' : 'right';
    for (let v = Math.floor(val - 32); v <= Math.ceil(val + 32); v++) {
      const y = CY + (v - val) * 16; if (y < 330 || y > 1500) continue;
      const major = v % 5 === 0;
      ctx.moveTo(x, y); ctx.lineTo(x + dir * (major ? 18 : 8), y);
      if (major) { ctx.fillStyle = rgba('gray', 1); ctx.fillText(labelFmt(v * unit), x + dir * 24, y + 5); }
    }
    ctx.stroke();
    ctx.fillStyle = rgba('cyan', 1); ctx.beginPath();
    ctx.moveTo(x + dir * 2, CY); ctx.lineTo(x + dir * 14, CY - 7); ctx.lineTo(x + dir * 14, CY + 7); ctx.fill();
  };
  vRuler(34, pD * 4, 0.25, 1, v => v.toFixed(1));
  vRuler(W - 34, cam.dist / 20, 20, -1, v => String(Math.round(v)));

  // bottom-left telemetry
  ctx.textAlign = 'left'; ctx.font = `500 21px ${MONO}`;
  const lat = 31.2304 + cam.pitch * 0.8, lon = 121.4737 + cam.yaw * 1.3;
  const rows = [
    ['AZ ', `${yawD >= 0 ? '+' : '−'}${pad(Math.abs(yawD).toFixed(2), 6)}°`],
    ['EL ', `${pD >= 0 ? '+' : '−'}${pad(Math.abs(pD).toFixed(2), 6)}°`],
    ['DST', `${cam.dist.toFixed(1)}`],
    ['LAT', `${lat.toFixed(4)}°N`],
    ['LON', `${lon.toFixed(4)}°E`],
  ];
  rows.forEach(([k, v], i) => {
    const y = H - M - 210 + i * 30;
    ctx.fillStyle = rgba('gray', 1); ctx.fillText(k, M + 40, y);
    ctx.fillStyle = i < 2 ? rgba('cyan', 1) : '#FFFFFF'; ctx.fillText(v, M + 100, y);
  });

  // bottom-right phase + segmented progress
  const ph = PHASES.find(p => t >= p[0] && t < p[1]) || PHASES[0];
  ctx.textAlign = 'right'; ctx.font = `700 24px ${MONO}`; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(ph[2], W - M - 40, H - M - 150);
  ctx.font = `500 18px ${MONO}`; ctx.fillStyle = rgba('gray', 1);
  ctx.fillText('EASE  OUT·EXPO  ·  KEYS 0', W - M - 40, H - M - 120);
  const bx0 = W - M - 40 - 380, bw = 380, by = H - M - 98;
  for (const [a, b] of PHASES) {
    const x = bx0 + bw * a / DUR + 3, w = bw * (b - a) / DUR - 6;
    ctx.fillStyle = rgba('gray', 0.35); ctx.fillRect(x, by, w, 6);
    const f = seg(t, a, b);
    if (f > 0) { ctx.fillStyle = f < 1 ? rgba('orange', 1) : rgba('cyan', 1); ctx.fillRect(x, by, w * f, 6); }
  }

  // bottom timeline with playhead
  const ly = H - M - 40, lx0 = M + 40, lx1 = W - M - 40;
  ctx.fillStyle = rgba('gray', 0.5); ctx.fillRect(lx0, ly, lx1 - lx0, 2);
  ctx.fillStyle = rgba('cyan', 1); ctx.fillRect(lx0, ly, (lx1 - lx0) * t / DUR, 2);
  for (const m of [3, 8, 12]) { const x = lerp(lx0, lx1, m / DUR); ctx.fillStyle = rgba('gray', 1); ctx.fillRect(x - 1, ly - 8, 2, 18); }
  const px = lerp(lx0, lx1, t / DUR);
  ctx.fillStyle = rgba('orange', 1); ctx.fillRect(px - 2, ly - 12, 4, 26);
  ctx.textAlign = 'left'; ctx.font = `500 16px ${MONO}`; ctx.fillStyle = rgba('gray', 1);
  ctx.fillText('00.000', lx0, ly + 30); ctx.textAlign = 'right'; ctx.fillText('15.000 ↺', lx1, ly + 30);
}

/* ───────────────────────── frame composition ───────────────────────── */
function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  updateCamera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.drawImage(bgC, 0, 0);

  ctx.save();
  ctx.translate(CX + cam.shx, CY + cam.shy); ctx.rotate(cam.roll); ctx.translate(-CX, -CY);
  drawGrid(t);
  drawObjects(t);
  drawParticles(t);
  drawCore(t);
  drawReticle(t);
  drawText1(t);
  drawText2(t);
  drawText3(t);
  ctx.restore();

  // impact flashes
  const fl = (t > 3.0 ? 0.32 * Math.exp(-(t - 3.0) * 9) : 0) + (t > 9.45 ? 0.16 * Math.exp(-(t - 9.45) * 8) : 0);
  if (fl > 0.003) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }

  ctx.drawImage(fxC, 0, 0);
  drawHUD(t);
}

/* ───────────────────────── playback & UI ───────────────────────── */
const $ = id => document.getElementById(id);
const btnPlay = $('play'), scrub = $('scrub'), timeEl = $('time'), bar = $('bar');
let t = 0, playing = true, scrubbing = false, last = performance.now();

function fit() {
  const avH = innerHeight - bar.offsetHeight - 36, avW = innerWidth - 24;
  const s = Math.min(avW / W, avH / H);
  cv.style.width = `${Math.floor(W * s)}px`; cv.style.height = `${Math.floor(H * s)}px`;
}
addEventListener('resize', fit); fit();

function setPlaying(p) { playing = p; btnPlay.textContent = p ? '❚❚' : '▶'; last = performance.now(); }
function step(d) { setPlaying(false); t = ((t + d) % DUR + DUR) % DUR; }
btnPlay.onclick = () => setPlaying(!playing);
cv.onclick = () => setPlaying(!playing);
$('restart').onclick = () => { t = 0; setPlaying(true); };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
scrub.addEventListener('input', () => { scrubbing = true; t = scrub.value / 1000; });
scrub.addEventListener('change', () => { scrubbing = false; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') step(1 / FPS);
  else if (e.code === 'ArrowLeft') step(-1 / FPS);
  else if (e.code === 'KeyR') { t = 0; setPlaying(true); }
  else if (e.code === 'KeyF') $('fs').onclick();
});

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (dt > 0) fpsSmooth += (1 / dt - fpsSmooth) * 0.05;
  if (playing && !scrubbing) t = (t + dt) % DUR;
  render(t);
  if (!scrubbing) scrub.value = Math.round(t * 1000);
  timeEl.innerHTML = `<b>${t.toFixed(3).padStart(6, '0')}</b> / 15.000s`;
  requestAnimationFrame(loop);
}
window.renderAt = s => { setPlaying(false); t = ((s % DUR) + DUR) % DUR; render(t); };
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
