<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AX-1 智能眼镜结构</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D stage on an ESD bench mat; instrument panels pinned to the corners */
  --bg:#0a0d11;
  --bg2:#121820;
  --panel:rgba(12,16,22,.9);
  --line:#243241;
  --fg:#dbe3ea;
  --muted:#8597a8;
  --amber:#f0a23b;   /* polyimide FPC */
  --cyan:#79c6e6;    /* hover / measurement */
  --hud:#5ef0a0;     /* waveguide HUD */
  --f-ui:"IBM Plex Sans Condensed","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#leaders line{stroke:rgba(121,198,230,.55);stroke-width:1}
#leaders line.cur{stroke:var(--amber)}
#leaders circle{fill:var(--cyan)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;line-height:1;padding:4px 7px;border-radius:3px;background:rgba(10,13,17,.82);border:1px solid var(--line);color:var(--fg);will-change:transform}
.lbl b{font-family:var(--f-mono);font-weight:500;color:var(--amber);margin-right:5px}
.lbl.cur{border-color:var(--amber);color:#fff}

.topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:calc(100vw - 32px)}
.topbar h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em;text-wrap:balance}
.topbar h1 span{font-family:var(--f-mono);font-weight:500;color:var(--amber);margin-right:8px}
.topbar p{margin:0;color:var(--muted);font-size:12px;font-family:var(--f-mono);letter-spacing:.02em}

.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:calc(100vw - 32px);backdrop-filter:blur(8px)}
.btn{font:500 13px/1 var(--f-ui);color:var(--fg);background:var(--bg2);border:1px solid var(--line);padding:9px 14px;border-radius:6px;cursor:pointer;letter-spacing:.04em;transition:border-color .15s,color .15s,background .15s}
.btn:hover:not(:disabled){border-color:#3a4c60}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(240,162,59,.1)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible,.bom-row:focus-visible,.bom-head:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.bom{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:min(460px,calc(100vw - 32px));max-height:calc(100% - 150px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);overflow:hidden}
.bom-head{all:unset;box-sizing:border-box;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;cursor:pointer;width:100%}
.bom-head strong{font-size:14px;font-weight:600;letter-spacing:.06em}
.bom-head span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bom-head i{font-style:normal;color:var(--muted);font-size:12px;margin-left:8px}
.bom-body{overflow:auto;border-top:1px solid var(--line);min-height:0}
.bom table{border-collapse:collapse;width:100%;font-size:12px}
.bom th{position:sticky;top:0;background:#0f141a;text-align:left;font-weight:500;color:var(--muted);padding:7px 8px;font-size:11px;letter-spacing:.08em;border-bottom:1px solid var(--line);white-space:nowrap}
.bom td{padding:7px 8px;border-bottom:1px solid rgba(36,50,65,.6);vertical-align:top}
.bom td.pn{font-family:var(--f-mono);color:var(--amber);white-space:nowrap}
.bom td.q{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.bom td.mat,.bom td.proc{color:var(--muted);min-width:110px}
.bom td.nm{white-space:nowrap}
.bom-row{cursor:pointer}
.bom-row:hover td{background:rgba(121,198,230,.06)}
.bom-row.sel td{background:rgba(240,162,59,.12)}

.steps{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);width:min(400px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px)}
.steps .no{font-family:var(--f-mono);font-size:12px;color:var(--amber);letter-spacing:.08em}
.steps .txt{margin:0;font-size:14px;line-height:1.55}
.steps .chips{display:flex;flex-wrap:wrap;gap:6px}
.steps .chips span{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.steps .chips b{font-family:var(--f-mono);font-weight:500;color:var(--amber);margin-right:4px}
.steps .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.steps .bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}
.steps .row{display:flex;gap:6px}
.steps .row .btn{flex:1}

.tip{position:fixed;left:0;top:0;width:max-content;max-width:min(330px,calc(100vw - 32px));pointer-events:none;background:rgba(10,13,17,.95);border:1px solid var(--cyan);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tip-h{display:flex;align-items:baseline;gap:8px}
.tip-h .pn{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.tip-h strong{font-size:15px;font-weight:600}
.tip-h em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.tip-d{margin:0;font-size:13px;line-height:1.5;color:var(--fg)}
.tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.tip dt{color:var(--muted)}
.tip dd{margin:0;min-width:0}
.tip dd.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.hint{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font-size:12px;color:var(--muted);pointer-events:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px;pointer-events:none}

@media (max-width:1180px){.hint{display:none}}
@media (max-width:720px){
  .topbar h1{font-size:16px}
  .bom{top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100% - 230px)}
  .btn{padding:8px 10px;font-size:12px}
  .steps{bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
}
</style>
</head>
<body>

<div id="stage"></div>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels" aria-hidden="true"></div>
<div class="loading" id="loading">正在生成模型…</div>

<header class="topbar">
  <h1><span>AX-1</span>AI 智能眼镜 · EVT2 结构样机</h1>
  <p>28 种物料 · 41 件 · 单位 mm</p>
</header>

<aside class="bom" id="bom">
  <button class="bom-head" id="bomToggle" aria-expanded="true" aria-controls="bomBody">
    <strong>BOM 物料清单</strong><span>28 项 · 41 件<i id="bomArrow">收起</i></span>
  </button>
  <div class="bom-body" id="bomBody">
    <table>
      <thead><tr><th>编号</th><th>名称</th><th>数量</th><th>材料</th><th>工艺</th></tr></thead>
      <tbody id="bomRows"></tbody>
    </table>
  </div>
</aside>

<section class="steps" id="steps" hidden aria-live="polite">
  <div class="no" id="stepNo">步骤 00 / 30</div>
  <p class="txt" id="stepTxt"></p>
  <div class="chips" id="stepChips"></div>
  <div class="bar"><i id="stepBar"></i></div>
  <div class="row">
    <button class="btn" id="stepPrev">上一步</button>
    <button class="btn" id="stepNext">下一步</button>
  </div>
</section>

<nav class="toolbar" aria-label="视图控制">
  <button class="btn" id="bExplode" aria-pressed="false">分解</button>
  <button class="btn" id="bFold" aria-pressed="false">折叠镜腿</button>
  <button class="btn" id="bSteps" aria-pressed="false">装配步骤</button>
  <button class="btn" id="bSection" aria-pressed="false">剖视</button>
  <button class="btn" id="bXray" aria-pressed="false">X 光</button>
  <button class="btn" id="bHome">复位视角</button>
</nav>

<div class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 悬停查看零件 · 点击选中</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){

const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

/* ---------------- 物料数据 ---------------- */
const INFO = {

/* ---------------- 几何工具 ---------------- */
function rrShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}
function smoothNormals(g){
  const p=g.attributes.position, n=new Float32Array(p.count*3), acc=new Map();
  const a=new V3(), b=new V3(), c=new V3(), cb=new V3(), ab=new V3();
  const key=i=>Math.round(p.getX(i)*500)+'_'+Math.round(p.getY(i)*500)+'_'+Math.round(p.getZ(i)*500);
  const keys=new Array(p.count);
  for(let i=0;i<p.count;i++) keys[i]=key(i);
  for(let i=0;i<p.count;i+=3){
    a.fromBufferAttribute(p,i); b.fromBufferAttribute(p,i+1); c.fromBufferAttribute(p,i+2);
    cb.subVectors(c,b); ab.subVectors(a,b); cb.cross(ab);
    for(let j=0;j<3;j++){ const k=keys[i+j]; const v=acc.get(k)||[0,0,0]; v[0]+=cb.x; v[1]+=cb.y; v[2]+=cb.z; acc.set(k,v); }
  }
  for(let i=0;i<p.count;i++){ const v=acc.get(keys[i]); const l=Math.hypot(v[0],v[1],v[2])||1; n[i*3]=v[0]/l; n[i*3+1]=v[1]/l; n[i*3+2]=v[2]/l; }
  g.setAttribute('normal', new THREE.BufferAttribute(n,3));
  return g;
}
function rbox(w,h,d,r){
  r=Math.min(r, w*.45, h*.45, d*.45);
  const iw=w-2*r, ih=h-2*r, cr=Math.min(r*.6, iw*.45, ih*.45);
  const g=new THREE.ExtrudeGeometry(rrShape(iw,ih,cr), {depth:Math.max(d-2*r,.01), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:6});
  g.translate(0,0,-Math.max(d-2*r,.01)/2);
  return smoothNormals(g);
}
function bend(g, dz=0){ const p=g.attributes.position; for(let i=0;i<p.count;i++) p.setZ(i, p.getZ(i)+wrapZ(p.getX(i))+dz); p.needsUpdate=true; return g; }

const CylZ=(r,l,s=24)=>new THREE.CylinderGeometry(r,r,l,s).rotateX(Math.PI/2);

/* 镜片轮廓：超椭圆 + 上宽下窄 */
const LCX=35.5, LCY=3, LA=24, LB=19;
function lensPts(cx, scale=1){
  const pts=[];
  for(let i=0;i<120;i++){
    const t=i/120*Math.PI*2, c=Math.cos(t), s=Math.sin(t);
    let x=LA*Math.sign(c)*Math.pow(Math.abs(c),.5), y=LB*Math.sign(s)*Math.pow(Math.abs(s),.5);
    x*=1+0.07*y/LB;
    pts.push(new THREE.Vector2(cx+x*scale, LCY+y*scale));
  }
  return pts;
}

function part(key, pn, side, parent, offA, offB){
  const g=new THREE.Group(); parent.add(g);

function add(p, geo, material, pos, rot, opt){

  p.group.add(m); p.meshes.push(m); return m;
}

function setExplode(on){

function gotoStep(i){
  stepIdx=Math.max(-1, Math.min(STEPS.length-1, i));
  const done=new Set(); for(let k=0;k<=stepIdx;k++) STEPS[k][0].forEach(x=>done.add(x));
  const now=performance.now();
  parts.forEach(p=>{ const tg=done.has(p.key)?0:1; if(p.target!==tg){ p.target=tg; p.startAt=now; } });
  curStep=new Set(stepIdx>=0?STEPS[stepIdx][0]:[]);
  if(curStep.size){
    const c=new V3(), v=new V3(); let n=0;
    curStep.forEach(k=>{ c.add(assembledWorld(partByKey[k],v)); n++; }); c.divideScalar(n);
    const off=camera.position.clone().sub(controls.target);
    flyTo(c, c.clone().add(off));
  } else if(stepIdx===STEPS.length-1){ flyTo(HOME_T.clone(), homePos()); }
  renderStep();
}
function renderStep(){
  const n=STEPS.length;
  $('stepNo').textContent = stepIdx<0 ? '全分解 · 共 '+n+' 步' : '步骤 '+String(stepIdx+1).padStart(2,'0')+' / '+n;
  $('stepTxt').textContent = stepIdx<0 ? '所有零件处于分解状态。按“下一步”按真实装配顺序逐个装回。' : STEPS[stepIdx][1];
  const chips=$('stepChips'); chips.innerHTML='';
  if(stepIdx>=0){
    const seen=new Set();
    STEPS[stepIdx][0].forEach(k=>{ const p=partByKey[k]; const t=p.pn+p.side; if(seen.has(t)) return; seen.add(t);
      const sp=document.createElement('span'); sp.innerHTML='<b>'+p.pn+'</b>'+p.label.textContent.replace(p.pn,''); chips.appendChild(sp); });
  }
  $('stepBar').style.width=((stepIdx+1)/n*100)+'%';
  $('stepPrev').disabled = stepIdx<0;
  $('stepNext').disabled = stepIdx>=n-1;
  $('stepNext').textContent = stepIdx<0 ? '开始装配' : '下一步';
}

function setXray(on){
  xrayOn=on;
  for(const p of parts){ if(!p.xray) continue;
    for(const m of p.meshes){ const mt=m.material;
      if(m.userData.decal){ m.visible=!on; continue; }
      mt.transparent = on ? true : m.userData.baseT;
      mt.opacity = on ? .12 : m.userData.baseO;
      mt.depthWrite = on ? false : m.userData.baseDW;
      m.castShadow = !on;
      mt.needsUpdate=true;
      if(m.userData.edges) m.userData.edges.visible=on;
    } }
  syncButtons();
}

    for(const m of p.meshes){ const mt=m.material;
      mt.clippingPlanes = on ? [clip[p.side]] : null;

  if(Math.hypot(e.clientX-downX, e.clientY-downY)>5) return;
  mouseX=e.clientX; mouseY=e.clientY; mouseIn=true;
  const pn=pick(); hoverPn = e.pointerType==='mouse' ? pn : null;
  selectPn(pn && pn!==selectedPn ? pn : null, false);
  if(pn) markBom(true);
});
cv.addEventListener('wheel', ()=>{ lastInteract=performance.now(); fly=null; }, {passive:true});

function pick(){
  const r=cv.getBoundingClientRect();
  mouse.set((mouseX-r.left)/r.width*2-1, -(mouseY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse, camera);
  const hits=ray.intersectObjects(raycastMeshes,false);
  for(const h of hits){
    const m=h.object, p=m.userData.part;
    if(!m.visible) continue;
    if(xrayOn && p.xray) continue;
    const cp=m.material.clippingPlanes;
    if(cp && cp.length && cp[0].distanceToPoint(h.point)<0) continue;
    if(m.material.blending===THREE.AdditiveBlending && hits.length>1) continue;
    return p.pn;
  }
  return null;
}
function tipHTML(pn){
  const d=INFO[pn]; const steps=parts.filter(p=>p.pn===pn).map(p=>stepOfKey[p.key]).filter(Boolean);
  const st=steps.length ? '步骤 '+[...new Set(steps)].sort((a,b)=>a-b).map(n=>String(n).padStart(2,'0')).join('、') : '—';
  return '<div class="tip-h"><span class="pn">'+pn+'</span><strong>'+d[0]+'</strong><em>× '+d[1]+'</em></div>'+
    '<p class="tip-d">'+d[5]+'</p>'+
    '<dl><dt>材料</dt><dd>'+d[2]+'</dd><dt>工艺</dt><dd>'+d[3]+'</dd><dt>尺寸</dt><dd class="mono">'+d[4]+' mm</dd><dt>装配</dt><dd class="mono">'+st+'</dd></dl>';
}
let tipPn=null;
function placeTip(x,y){
  const w=tip.offsetWidth, h=tip.offsetHeight; let X=x+18, Y=y+18;
  if(X+w>innerWidth-12) X=x-w-18; if(Y+h>innerHeight-12) Y=innerHeight-h-12; if(X<12) X=12; if(Y<12) Y=12;
  tip.style.transform='translate('+X+'px,'+Y+'px)';
}

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});

/* ---------------- 主循环 ---------------- */
const AMBER=new THREE.Color(0xf0a23b), CYAN=new THREE.Color(0x79c6e6);
const clock=new THREE.Clock(); let hudSec=-1;
const vA=new V3(), vC=new V3();
$('loading').remove();
syncButtons();

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(), .05), now=performance.now(), tt=now/1000;

  // 镜腿折叠
  const fs=reduced?10:1.25;
  foldT += Math.max(-dt*fs, Math.min(dt*fs, foldTarget-foldT));
  const fe=ease(clamp01(foldT));
  pivots.R.rotation.y = -fe*THREE.MathUtils.degToRad(90);
  pivots.L.rotation.y =  fe*THREE.MathUtils.degToRad(82);

  // 分解动画：先外移(offA)，再展开内部(offB)
  const sp=reduced?20:.95;
  for(const p of parts){
    if(now>=p.startAt){ const d=p.target-p.t; p.t += Math.sign(d)*Math.min(Math.abs(d), dt*sp); }
    const a=ease(clamp01(p.t*2)), b=ease(clamp01(p.t*2-1));
    p.group.position.set(0,0,0).addScaledVector(p.offA,a).addScaledVector(p.offB,b);
  }
  ribbons.forEach(updateRibbon);

  // 转台自转
  const idle = !stepMode && !selectedPn && !hoverPn && !sectionOn && !fly && !dragging && now-lastInteract>2500 && !reduced;
  if(idle) T.rotation.y += dt*.16;

  // 指示灯呼吸、HUD 时间
  const br=.5+.5*Math.sin(tt*2.2);
  ledMesh.userData.baseI=.25+1.2*br; ledGlow.material.opacity=.15+.55*br;
  hudFront.material.opacity=.45+.08*Math.sin(tt*1.3); hudBack.material.opacity=.85+.1*Math.sin(tt*1.3);
  const sec=Math.floor(tt); if(sec!==hudSec && sec%5===0){ hudSec=sec; drawHud(); }

  // 相机飞行
  if(fly){
    const k=clamp01((now-fly.t0)/fly.dur), e=ease(k);
    controls.target.lerpVectors(fly.fT, fly.tT, e); camera.position.lerpVectors(fly.fP, fly.tP, e);
    if(k>=1) fly=null;
  }
  controls.update();
  T.updateMatrixWorld(true);

  // 剖切平面跟随镜腿
  if(sectionOn){
    clip.R.copy(localClip.R).applyMatrix4(partByKey.shellRU.group.matrixWorld);
    clip.L.copy(localClip.L).applyMatrix4(partByKey.shellLU.group.matrixWorld);
  }

  // 悬停拾取
  if(needPick && mouseIn && !dragging){ needPick=false; hoverPn=pick(); cv.style.cursor=hoverPn?'pointer':'grab'; }

  // 高亮
  const pulse=.35+.25*Math.sin(now*.006);
  for(const p of parts){
    let col=null, inten=0;
    if(stepMode && curStep.has(p.key)){ col=AMBER; inten=pulse; }
    if(selectedPn===p.pn){ col=AMBER; inten=pulse+.1; }
    if(hoverPn===p.pn){ col=CYAN; inten=.6; }
    for(const m of p.meshes){ const mt=m.material; if(!mt.emissive) continue;
      if(col){ mt.emissive.copy(col); mt.emissiveIntensity=inten; } else { mt.emissive.copy(m.userData.baseE); mt.emissiveIntensity=m.userData.baseI; } }
  }

  renderer.render(scene, camera);

  // 提示卡
  const showPn = (hoverPn && !dragging) ? hoverPn : selectedPn;
  if(showPn){
    if(tipPn!==showPn){ tip.innerHTML=tipHTML(showPn); tipPn=showPn; }
    tip.hidden=false;
    if(hoverPn && !dragging) placeTip(mouseX, mouseY);
    else { const p=parts.find(q=>q.pn===selectedPn); anchorWorld(p,vA).project(camera); placeTip((vA.x+1)/2*innerWidth+30, (1-vA.y)/2*innerHeight-30); }
  } else if(!tip.hidden){ tip.hidden=true; tipPn=null; }

  // 标签
  const showLabels = exploded || stepMode;
  vC.set(0,5,-75); M.localToWorld(vC).project(camera);
  const cx=(vC.x+1)/2*innerWidth, cy=(1-vC.y)/2*innerHeight;
  for(const p of parts){
    const isCur=stepMode && curStep.has(p.key);
    const vis = showLabels && (p.t>.6 || isCur);
    if(!vis){ if(!p.label.hidden){ p.label.hidden=true; p.line.style.display='none'; } continue; }
    anchorWorld(p,vA).project(camera);
    if(vA.z>1){ p.label.hidden=true; p.line.style.display='none'; continue; }
    const ax=(vA.x+1)/2*innerWidth, ay=(1-vA.y)/2*innerHeight;
    let dx=ax-cx, dy=ay-cy; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    const lx=ax+dx*30, ly=ay+dy*22;
    p.label.hidden=false; p.label.classList.toggle('cur',isCur);
    p.label.style.transform='translate('+lx+'px,'+ly+'px) translate('+(dx<0?'-100%':'0')+',-50%)';
    p.label.style.opacity = isCur ? 1 : Math.min(1,(p.t-.6)*4);
    const ln=p.line; ln.style.display=''; ln.setAttribute('x1',ax); ln.setAttribute('y1',ay); ln.setAttribute('x2',lx); ln.setAttribute('y2',ly);
    ln.classList.toggle('cur',isCur);
  }
}
frame();
})();
</script>
