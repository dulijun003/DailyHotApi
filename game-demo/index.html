<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>喵喵消消乐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #16220d;
    font-family: "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; width: 540px; height: 960px; overflow: hidden; transform-origin: center center;
    background:
      radial-gradient(ellipse 70% 45% at 50% 52%, rgba(255,244,190,.95), rgba(255,232,150,0) 70%),
      linear-gradient(180deg, #5d8a30 0%, #9fbf52 30%, #d9dc80 52%, #93b44c 78%, #4a7628 100%); }
  canvas { position: absolute; left: 0; top: 0; width: 540px; height: 960px; pointer-events: none; }
  #fx { z-index: 2600; }
  #rays { position: absolute; left: -230px; top: -10px; width: 1000px; height: 1000px; pointer-events: none; opacity: .55;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,225,.35) 0 5deg, rgba(255,255,225,0) 5deg 15deg);
    -webkit-mask: radial-gradient(circle, #000 0 18%, transparent 55%); mask: radial-gradient(circle, #000 0 18%, transparent 55%);
    animation: spin 80s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bush { position: absolute; border-radius: 50%; pointer-events: none; }
  .trunk { position: absolute; width: 28px; background: linear-gradient(90deg,#5e3f22,#8a6238,#5e3f22); border-radius: 14px; opacity: .5; }
  .leaf { position: absolute; border-radius: 60% 0 60% 0; pointer-events: none; animation: sway 4s ease-in-out infinite alternate; transform-origin: 0 100%; }
  @keyframes sway { from { rotate: -6deg; } to { rotate: 8deg; } }
  #world { position: absolute; inset: 0; }

  /* header */
  .round-btn { position: absolute; top: 34px; width: 62px; height: 62px; border-radius: 50%; cursor: pointer; z-index: 10;
    background: radial-gradient(circle at 40% 35%, #fbfbfb, #b9bdc2); border: 4px solid #8e959c;
    box-shadow: 0 4px 0 #5f666d, 0 6px 10px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
  .round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5f666d; }
  .round-btn svg { width: 34px; height: 34px; }
  #logo { position: absolute; top: 22px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #logo .l1 { font-size: 24px; font-weight: 900; color: #5ad1ff; letter-spacing: 6px;
    text-shadow: 0 3px 0 #1765b8, 2px 0 #1765b8, -2px 0 #1765b8, 0 -2px #1765b8; }
  #logo .l2 { font-size: 40px; font-weight: 900; color: #fff3a6; margin-top: -6px; letter-spacing: 3px;
    text-shadow: 0 4px 0 #c9631a, 3px 0 #c9631a, -3px 0 #c9631a, 0 -3px #c9631a, 0 8px 8px rgba(0,0,0,.35); }
  #hud { position: absolute; top: 108px; left: 22px; right: 22px; height: 32px; display: flex; align-items: center; gap: 10px;
    color: #fff; font-weight: bold; font-size: 17px; text-shadow: 0 2px 2px rgba(0,0,0,.55); }
  #hud .lv { min-width: 74px; }
  #bar { flex: 1; height: 16px; border-radius: 9px; background: rgba(40,30,10,.45); border: 2px solid rgba(255,255,255,.8); overflow: hidden; position: relative; }
  #barFill { height: 100%; width: 0; border-radius: 8px; background: linear-gradient(180deg,#fff27a,#ffb21f); box-shadow: 0 0 10px #ffd84a; transition: width .35s; }
  #hud .sc { min-width: 84px; text-align: right; }
  #hud .sc.bump { animation: bump .3s; }
  @keyframes bump { 50% { transform: scale(1.35); color: #fff27a; } }

  /* tray */
  #tray { position: absolute; left: 14px; right: 14px; top: 148px; height: 92px; border-radius: 18px;
    background: linear-gradient(180deg,#d08d50,#9c5d2a); border: 4px solid #6e3c17;
    box-shadow: inset 0 3px 0 rgba(255,220,170,.5), 0 6px 0 #5a2f10, 0 10px 18px rgba(0,0,0,.35); }
  .slot { position: absolute; top: 10px; width: 64px; height: 66px; border-radius: 10px; background: rgba(60,50,45,.55);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.5); }
  #tray.danger { animation: danger .45s ease-in-out infinite alternate; }
  @keyframes danger { to { box-shadow: inset 0 3px 0 rgba(255,220,170,.5), 0 6px 0 #5a2f10, 0 0 26px 8px rgba(255,50,30,.95); border-color: #c0261a; } }
  #tray.shake { animation: shake .5s; }
  @keyframes shake { 20%,60% { translate: -10px 0; } 40%,80% { translate: 10px 0; } }

  /* tiles */
  .tile { position: absolute; width: 64px; height: 70px; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg,#ffffff 0%, #eef1f7 85%);
    box-shadow: 0 6px 0 #c3c8d6, 0 8px 6px rgba(0,0,0,.35);
    transition: left .26s cubic-bezier(.3,.8,.3,1), top .26s cubic-bezier(.3,.8,.3,1), filter .35s; }
  .tile svg { position: absolute; left: 3px; top: 3px; width: 58px; height: 58px; pointer-events: none; }
  .tile.blocked { filter: brightness(.48) saturate(.6); cursor: default; }
  .tile.inTray { cursor: default; }
  .tile.hint { animation: hint .55s ease-in-out infinite alternate; }
  @keyframes hint { to { translate: 0 -8px; filter: drop-shadow(0 0 10px #fff58a); } }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 45%, transparent 60%); background-size: 300% 100%; background-position: 120% 0; opacity: 0; }
  .tile.shine::after { animation: shine .6s ease-out; }
  @keyframes shine { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -60% 0; } }

  .float { position: absolute; z-index: 2700; font-weight: 900; pointer-events: none; white-space: nowrap; }
  .score-pop { font-size: 26px; color: #fff; text-shadow: 0 2px 0 #e0761b, 2px 0 #e0761b, -2px 0 #e0761b, 0 -2px #e0761b; }
  .combo { font-size: 40px; color: #fff6a8; text-shadow: 0 4px 0 #d0401a, 3px 0 #d0401a, -3px 0 #d0401a, 0 -3px #d0401a, 0 8px 14px rgba(0,0,0,.4); }

  /* bottom tools */
  #tools { position: absolute; bottom: 26px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; z-index: 10; }
  .tool { width: 132px; height: 56px; border-radius: 16px; color: #fff; font-size: 19px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; gap: 6px; border: 3px solid #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.3); box-shadow: 0 5px 0 rgba(0,0,0,.3); cursor: pointer; position: relative; transition: transform .1s, filter .3s; }
  .tool svg { width: 22px; height: 22px; }
  .tool .n { position: absolute; top: -10px; right: -8px; width: 26px; height: 26px; border-radius: 50%; background: #ff4b4b;
    font-size: 15px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .t1 { background: linear-gradient(#5fc4ff,#2f8ae0); } .t2 { background: linear-gradient(#ffcf4d,#f09a17); } .t3 { background: linear-gradient(#8de06a,#3fa83a); }
  .tool.used { filter: grayscale(.85) brightness(.9); }
  .tool:active, .tool.press { transform: translateY(3px) scale(.97); }

  /* overlays */
  .overlay { position: absolute; inset: 0; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(18,28,8,.6); opacity: 0; pointer-events: none; transition: opacity .45s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .panel { position: relative; background: linear-gradient(#fffaf0,#ffe6a2); border: 6px solid #e39a2d; border-radius: 28px; padding: 26px 34px 28px; text-align: center; min-width: 360px;
    box-shadow: 0 10px 0 #b56d14, 0 18px 30px rgba(0,0,0,.4); transform: scale(.5) translateY(40px); transition: transform .55s cubic-bezier(.3,1.7,.5,1); }
  .overlay.show .panel { transform: none; }
  .panel h1 { font-size: 44px; color: #e5651a; text-shadow: 0 3px 0 #fff; }
  .panel p { font-size: 19px; color: #7a4a1a; margin-top: 8px; line-height: 1.5; }
  .ribbon { position: absolute; top: -30px; left: 50%; translate: -50% 0; padding: 8px 46px; background: linear-gradient(#ff7a59,#e2402b); color: #fff; font-size: 24px; font-weight: 900;
    border-radius: 10px; box-shadow: 0 5px 0 #a8261a; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .stars { display: flex; justify-content: center; gap: 10px; margin: 26px 0 6px; height: 74px; align-items: flex-end; }
  .stars svg { width: 66px; height: 66px; transform: scale(0); }
  .stars svg:nth-child(2) { width: 82px; height: 82px; }
  .stars svg.on { animation: starIn .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes starIn { from { transform: scale(3) rotate(-60deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .btns { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }
  .btn { display: inline-block; padding: 12px 32px; border-radius: 30px; font-size: 22px; font-weight: bold; color: #fff; cursor: pointer;
    background: linear-gradient(#8de06a,#3fa83a); border: 3px solid #fff; box-shadow: 0 5px 0 #2a7a26; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .btn.blue { background: linear-gradient(#5fc4ff,#2f8ae0); box-shadow: 0 5px 0 #1d5ea3; }
  .btn.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .btn:active, .btn.press { transform: translateY(3px) scale(.96); }
  .cats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 16px auto 0; max-width: 250px; }
  .cats svg { width: 44px; height: 44px; background: #fff; border-radius: 9px; box-shadow: 0 3px 0 #c3c8d6; }

  /* level map */
  #map { background: radial-gradient(ellipse 80% 50% at 50% 40%, rgba(255,240,170,.25), transparent 70%), linear-gradient(180deg, #3d6e1f, #1f4210); justify-content: flex-start; }
  #map h2 { margin-top: 44px; font-size: 38px; color: #fff3a6; font-weight: 900; text-shadow: 0 4px 0 #c9631a, 3px 0 #c9631a, -3px 0 #c9631a, 0 -3px #c9631a; }
  #map .sub { color: #e6f5c8; font-size: 16px; margin-top: 4px; }
  #mapScroll { position: relative; margin-top: 14px; width: 540px; flex: 1; overflow-y: auto; scrollbar-width: none; }
  #mapScroll::-webkit-scrollbar { display: none; }
  #mapInner { position: relative; width: 540px; }
  #mapPath { position: absolute; left: 0; top: 0; }
  .node { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #fff;
    background: radial-gradient(circle at 40% 30%, #ffe27a, #f39a17); border: 5px solid #fff; box-shadow: 0 6px 0 #b0600c, 0 10px 14px rgba(0,0,0,.4);
    text-shadow: 0 2px 0 #b0600c; }
  .node.locked { background: radial-gradient(circle at 40% 30%, #c9cfd6, #8a929b); box-shadow: 0 6px 0 #5f666d, 0 10px 14px rgba(0,0,0,.4); cursor: default; text-shadow: none; }
  .node.cur { animation: pulse 1s ease-in-out infinite; }
  .node .st { position: absolute; bottom: -26px; font-size: 20px; color: #ffd21a; letter-spacing: 1px; text-shadow: 0 2px 0 #8a5a00; }
  .node .shape { position: absolute; top: -24px; font-size: 13px; color: #fff; font-weight: bold; background: rgba(0,0,0,.35); padding: 1px 8px; border-radius: 8px; text-shadow: none; white-space: nowrap; }

  #banner { position: absolute; left: 0; right: 0; top: 410px; z-index: 2900; text-align: center; pointer-events: none; opacity: 0; }
  #banner .b { display: inline-block; padding: 14px 70px; font-size: 44px; font-weight: 900; color: #fff;
    background: linear-gradient(90deg, rgba(226,64,43,0), #e2402b 18%, #ff7a59 50%, #e2402b 82%, rgba(226,64,43,0));
    text-shadow: 0 3px 0 #9a2010; }
  #banner .s { font-size: 20px; color: #fff; margin-top: 8px; text-shadow: 0 2px 3px rgba(0,0,0,.6); font-weight: bold; }
  #toast { position: absolute; left: 50%; top: 280px; translate: -50% 0; z-index: 3500; padding: 10px 24px; border-radius: 22px; background: rgba(0,0,0,.65);
    color: #fff; font-size: 18px; opacity: 0; transition: opacity .3s; pointer-events: none; }

  #finger { position: absolute; width: 62px; height: 62px; z-index: 5000; pointer-events: none; left: 300px; top: 1100px;
    transition: left .26s cubic-bezier(.4,.1,.3,1), top .26s cubic-bezier(.4,.1,.3,1), transform .1s; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }
  #finger.tap { transform: scale(.82); }
  #fade { position: absolute; inset: 0; background: #000; z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .8s; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="rays"></div>
  <canvas id="bg"></canvas>
  <div id="world">
    <div class="round-btn" id="backBtn" style="left:24px"><svg viewBox="0 0 24 24"><path d="M14 5 7 12l7 7M7 12h12" stroke="#6d757d" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="round-btn" id="soundBtn" style="right:24px"><svg viewBox="0 0 24 24" id="soundIcon"></svg></div>
    <div id="logo"><div class="l1">喵喵</div><div class="l2">消消乐</div></div>
    <div id="hud"><span class="lv" id="lvText">第 1 关</span><div id="bar"><div id="barFill"></div></div><span class="sc" id="score">★ 0</span></div>
    <div id="tray"></div>
    <div id="board"></div>
    <div id="tools">
      <div class="tool t1" id="toolOut"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>移出<span class="n">1</span></div>
      <div class="tool t2" id="toolUndo"><svg viewBox="0 0 24 24"><path d="M9 6 4 11l5 5M4 11h10a6 6 0 0 1 0 12h-3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>撤回<span class="n">1</span></div>
      <div class="tool t3" id="toolShuffle"><svg viewBox="0 0 24 24"><path d="M3 7h4c5 0 5 10 10 10h4M3 17h4c2 0 3-1.5 4-3M21 7h-4c-2 0-3 1.5-4 3M18 4l3 3-3 3M18 14l3 3-3 3" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>洗牌<span class="n">1</span></div>
    </div>
  </div>
  <canvas id="fx"></canvas>
  <div id="banner"><div class="b" id="bannerT">第 1 关</div><div class="s" id="bannerS"></div></div>
  <div id="toast"></div>

  <div class="overlay" id="map">
    <h2>选择关卡</h2><div class="sub">20 个关卡 · 10 种猫咪 · 越往后越烧脑</div>
    <div id="mapScroll"><div id="mapInner"><svg id="mapPath"></svg></div></div>
  </div>
  <div class="overlay" id="win"><div class="panel">
    <div class="ribbon">恭喜过关</div>
    <div class="stars" id="winStars"></div>
    <p id="winInfo"></p>
    <div class="btns"><div class="btn blue" id="winMap">关卡</div><div class="btn pulse" id="winNext">下一关</div></div>
  </div></div>
  <div class="overlay" id="lose"><div class="panel">
    <div class="ribbon" style="background:linear-gradient(#8a96a6,#5f6b7a);box-shadow:0 5px 0 #3e4752">槽位已满</div>
    <p style="margin-top:22px">差一点就成功啦！<br>用「移出」腾出位置，或者重新挑战</p>
    <div class="btns"><div class="btn blue" id="loseOut">移出继续</div><div class="btn" id="loseRetry">重新开始</div></div>
  </div></div>
  <div class="overlay" id="endCard"><div class="panel">
    <h1>喵喵消消乐</h1>
    <p>20 个关卡 · 10 种猫咪<br>点击方块，凑齐 3 个就消除！</p>
    <div class="cats" id="endCats"></div>
    <div class="btns"><div class="btn pulse">立即开玩</div></div>
  </div></div>
  <svg id="finger" viewBox="0 0 64 64"><path d="M24 6c3 0 5 2 5 5v17l2-1c2-1 5 0 6 2l1 2 2-1c2-1 5 0 6 2l1 2 1-.3c2.7-.7 5 1.3 5 4v10c0 8-6 14-14 14h-6c-5 0-9-2-12-6L9 41c-1.5-2-1-5 1-6.3 2-1.3 4.5-.8 6 1l3 3.5V11c0-3 2-5 5-5Z" fill="#fff" stroke="#333" stroke-width="2.4" stroke-linejoin="round"/></svg>
  <div id="fade"></div>
</div></div>

<script>
'use strict';
const DEMO = /[?&]demo/.test(location.search);
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);

// =====================================================================
// Cat artwork — pure SVG, 10 breeds
// =====================================================================
const EAR = (c, inner, c2 = c) => `
  <path d="M14 30 L12 6 L32 20 Z" fill="${c}"/><path d="M88 30 L90 6 L70 20 Z" fill="${c2}"/>
  <path d="M17 26 L16 12 L28 21 Z" fill="${inner}"/><path d="M85 26 L86 12 L74 21 Z" fill="${inner}"/>`;
const EYES = (l, r = l) => `
  <ellipse cx="36" cy="54" rx="8.5" ry="9.5" fill="#fff"/><ellipse cx="66" cy="54" rx="8.5" ry="9.5" fill="#fff"/>
  <ellipse cx="36" cy="55" rx="6.8" ry="7.8" fill="${l}"/><ellipse cx="66" cy="55" rx="6.8" ry="7.8" fill="${r}"/>
  <ellipse cx="36" cy="56" rx="3.2" ry="5" fill="#1b1b1b"/><ellipse cx="66" cy="56" rx="3.2" ry="5" fill="#1b1b1b"/>
  <circle cx="38.5" cy="51.5" r="2.3" fill="#fff"/><circle cx="68.5" cy="51.5" r="2.3" fill="#fff"/>
  <ellipse cx="36" cy="54" rx="8.5" ry="9.5" fill="none" stroke="#2a2a2a" stroke-width="1.6"/>
  <ellipse cx="66" cy="54" rx="8.5" ry="9.5" fill="none" stroke="#2a2a2a" stroke-width="1.6"/>`;
const MOUTH = (wh = '#666', ln = '#3a2a2a') => `
  <path d="M47 66 h8 l-4 4.5 z" fill="#f28aa0" stroke="#c45a74" stroke-width="1"/>
  <path d="M51 70.5 q-3 6 -8 3 M51 70.5 q3 6 8 3" stroke="${ln}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M28 66 L8 62 M28 70 L8 72 M74 66 L94 62 M74 70 L94 72" stroke="${wh}" stroke-width="1.4" stroke-linecap="round"/>`;
const HEAD = 'M51 18 C26 18 12 32 11 52 C10 74 28 90 51 90 C74 90 92 74 91 52 C90 32 76 18 51 18 Z';
const ROUND = 'M51 20 C24 20 9 36 9 56 C9 76 28 90 51 90 C74 90 93 76 93 56 C93 36 78 20 51 20 Z';
const FLUFF = 'M51 16 C40 14 33 20 26 21 C18 24 15 30 12 36 C7 42 9 50 8 56 C8 64 12 70 15 76 C19 82 26 86 33 89 C39 92 45 90 51 92 C57 90 63 92 69 89 C76 86 83 82 87 76 C90 70 94 64 94 56 C93 50 95 42 90 36 C87 30 84 24 76 21 C69 20 62 14 51 16 Z';
const STK = 'stroke="#3a2a22" stroke-width="2.2"';
const BLAZE = 'M51 34 C44 46 30 60 26 74 C34 86 44 90 51 90 C58 90 68 86 76 74 C72 60 58 46 51 34 Z';
const CATS = [
  `${EAR('#f2a541', '#ffc9b5')}<path d="${HEAD}" fill="#f6b04e" ${STK}/>
   <path d="M51 22v10M43 23l2 9M59 23l-2 9M14 50h9M13 57h9M88 50h-9M89 57h-9" stroke="#c96a1b" stroke-width="3.2" stroke-linecap="round"/>
   <ellipse cx="51" cy="72" rx="17" ry="12" fill="#fff4e6"/>${EYES('#7dc242')}${MOUTH()}`,
  `${EAR('#f6f6f8', '#ffc6d2')}<path d="${FLUFF}" fill="#fbfbfd" ${STK}/>${EYES('#9fb4c8')}${MOUTH('#aaa')}`,
  `${EAR('#222', '#f7a8b8')}<path d="${HEAD}" fill="#262626" ${STK}/><path d="${BLAZE}" fill="#fff"/>${EYES('#e7d23a')}${MOUTH('#ddd')}`,
  `${EAR('#e8892c', '#ffc6d2', '#2a2a2a')}<path d="${HEAD}" fill="#fffdf9" ${STK}/>
   <path d="M51 19 C30 19 15 30 12 48 C20 50 30 44 36 36 C42 30 46 24 51 19 Z" fill="#e8892c"/>
   <path d="M60 19 C76 21 88 32 90 50 C82 50 74 44 70 36 C66 30 62 24 60 19 Z" fill="#2a2a2a"/>
   <path d="${HEAD}" fill="none" ${STK}/>${EYES('#4fa3e8')}${MOUTH('#999')}`,
  `${EAR('#7b5a46', '#e8b0b0')}<path d="${FLUFF}" fill="#fbf4ea" ${STK}/>
   <path d="M22 44 C26 32 40 30 46 46 C42 54 30 58 22 44 Z M80 44 C76 32 62 30 56 46 C60 54 72 58 80 44 Z" fill="#9a7458"/>
   ${EYES('#3d8fe0')}${MOUTH('#999')}`,
  `${EAR('#e0a53a', '#ffc9a8')}<path d="${HEAD}" fill="#e9b44c" ${STK}/>
   <g fill="#8a5a1a"><circle cx="24" cy="40" r="3"/><circle cx="78" cy="40" r="3"/><circle cx="18" cy="56" r="2.6"/><circle cx="84" cy="56" r="2.6"/><circle cx="28" cy="74" r="2.6"/><circle cx="74" cy="74" r="2.6"/></g>

      + `<span class="shape">${SHAPE_NAMES[levelCfg(n).shape]}</span>` + (st ? `<span class="st">${'★'.repeat(st)}</span>` : '');
    el.onclick = () => { if (locked) { toast('先通过前面的关卡哦'); return; } Snd.resume(); Snd.play('click'); startLevel(n); };
    inner.appendChild(el);
  }
}
function openMap() { if (G) { G.state = 'menu'; clearHint(); } buildMap(); hideAll(); show('map');
  const cur = nodeXY(save.unlocked - 1); $('mapScroll').scrollTop = Math.max(0, cur.y - 260); }
$('backBtn').onclick = () => { Snd.resume(); Snd.play('click'); openMap(); };
$('soundBtn').onclick = () => { Snd.resume(); Snd.toggle(); Snd.play('click'); toast(Snd.on ? '音效：开' : '音效：关'); };
$('winNext').onclick = () => { Snd.play('click'); startLevel(G.n >= MAX_LEVEL ? 1 : G.n + 1); };
$('winMap').onclick = () => { Snd.play('click'); openMap(); };
$('loseRetry').onclick = () => { Snd.play('click'); startLevel(G.n); };
document.querySelector('#endCard .btn').onclick = () => openMap();

// =====================================================================
// Auto-play demo (?demo) — used to record the showcase video
// =====================================================================
const finger = $('finger');
async function fingerTap(el) {
  const c = stageXY(el); finger.style.left = (c.x - 22) + 'px'; finger.style.top = (c.y - 6) + 'px';
  await wait(250); finger.classList.add('tap'); el.classList.add('press');
  P({ type: 'ring', x: c.x, y: c.y, max: .4, size: 8, grow: 40, color: 'rgba(255,255,255,' });
  await wait(90); finger.classList.remove('tap'); el.classList.remove('press'); el.click();
}
const until = async f => { while (!f()) await wait(30); };
async function playLevel({ undoAt = -1, limit = 1e9 } = {}) {
  await until(() => G.state === 'play');
  let k = 0, undone = false;
  for (const id of G.sol) {
    if (k >= limit) break;
    const t = G.tiles[id]; await until(() => !G.busy);
    await fingerTap(t.el); await wait(60);
    if (!undone && undoAt >= 0 && k >= undoAt) await until(() => !G.busy);
    if (!undone && undoAt >= 0 && k >= undoAt && t.state === 'tray' && G.history[G.history.length - 1] === t) { undone = true; await wait(250); await fingerTap($('toolUndo')); await wait(250); await until(() => !G.busy); await fingerTap(t.el); await wait(60); }
    k++;
  }
}
async function runDemo() {
  Snd.init(); Snd.resume(); Snd.log = [];
  await wait(1200);
  window.__t0 = Date.now(); Snd.startMusic();
  openMap(); await wait(1600);
  await fingerTap($('node1'));
  await playLevel(); await until(() => G.state === 'win'); await wait(2300);
  await fingerTap($('winNext'));
  await playLevel({ undoAt: 6 }); await until(() => G.state === 'win'); await wait(2300);
  await fingerTap($('winMap')); await wait(1200);
  $('mapScroll').scrollTo({ top: 600, behavior: 'smooth' }); await wait(1300);
  $('mapScroll').scrollTo({ top: 0, behavior: 'smooth' }); await wait(1100);
  await fingerTap($('node3'));
  await playLevel({ limit: 24 }); await until(() => !G.busy); await wait(500);
  finger.style.top = '1100px';
  G.state = 'menu'; show('endCard'); Snd.play('win'); confettiCannon(0, 1); confettiCannon(540, -1);
  await wait(4200);
  $('fade').style.opacity = 1; Snd.log.push({ t: Date.now(), name: '#fade' }); Snd.master.gain.setTargetAtTime(0, Snd.ctx.currentTime, .25); await wait(1000);
  window.__t1 = Date.now();
  document.title = 'DEMO_DONE';
}
if (DEMO) runDemo();
else openMap();
